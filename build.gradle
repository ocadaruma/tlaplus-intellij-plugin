import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent
import org.jetbrains.intellij.platform.gradle.TestFrameworkType
import org.jetbrains.intellij.platform.gradle.tasks.*

plugins {
    id("java")
    id("org.jetbrains.intellij.platform") version "2.18.1"
    id("org.jetbrains.intellij.platform.grammarkit") version "2.18.1"
    id("de.undercouch.download") version "5.7.0"
}

group = "com.mayreh.intellij.plugins"
version = "${version}" + (snapshot.toBoolean() ? "-SNAPSHOT" : "")

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

def tla2tools = layout.buildDirectory.file("libs/tla2tools.jar")
def prepareLib = tasks.register("prepareLib", Download) {
    src "https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar"
    dest tla2tools
    overwrite false
}

dependencies {
    intellijPlatform {
        intellijIdea providers.gradleProperty("platformVersion")
        bundledPlugin "org.intellij.intelliLang"
        testFramework TestFrameworkType.Platform.INSTANCE
        pluginVerifier()
    }

    implementation(files(tla2tools).builtBy(prepareLib))
    // We need to use same version of lsp4j as tla2tools to avoid incompatibility
    implementation "org.eclipse.lsp4j:org.eclipse.lsp4j.debug:0.21.1"

    def lombokVersion = '1.18.48'
    compileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"
    testCompileOnly "org.projectlombok:lombok:$lombokVersion"
    testAnnotationProcessor "org.projectlombok:lombok:$lombokVersion"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.assertj:assertj-core:3.27.7"
}

intellijPlatform {
    pluginConfiguration {
        version = project.version
        ideaVersion {
            sinceBuild = providers.gradleProperty("sinceBuild")
            untilBuild = provider { null }
        }
    }
    publishing {
        token = providers.gradleProperty("intellijPublishToken")
    }
    pluginVerification {
        ides {
            recommended()
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

def generatedRoot = layout.buildDirectory.dir("generated/sources/grammar")

def lexers = [
    [component: "tlaplus", flex: "tlaplus.flex", class: "_TLAplusLexer"],
    [component: "tlaplus", flex: "tlaplus_modulebegin.flex", class: "_TLAplusModuleBeginLexer"],
    [component: "tlaplus", flex: "tlaplus_plus_cal_comment.flex", class: "_TLAplusPlusCalCommentLexer"],
    [component: "tlc", flex: "tlc_error_trace.flex", class: "_TLCErrorTraceLexer"],
    [component: "tlc", flex: "tlc_config.flex", class: "_TLCConfigLexer"],
    [component: "pluscal", flex: "plus_cal_algorithmbegin.flex", class: "_PlusCalAlgorithmBeginLexer"],
]

def parsers = [
    [component: "tlaplus", bnf: "tlaplus.bnf", class: "TLAplusParser"],
    [component: "tlc", bnf: "tlc_config.bnf", class: "TLCConfigParser"]
]

def lexerTasks = lexers.collect { spec ->
    tasks.register("generate" + spec.class, GenerateLexerTask) {
        sourceFile.set(layout.projectDirectory.file("src/main/grammar/${spec.flex}"))
        targetRootOutputDir.set(generatedRoot)
        pathToClass.set("com/mayreh/intellij/plugin/${spec.component}/lexer/${spec.class}.java")
    }
}

def parserTasks = parsers.collect { spec ->
    tasks.register("generate" + spec.class, GenerateParserTask) {
        sourceFile.set(layout.projectDirectory.file("src/main/grammar/${spec.bnf}"))
        targetRootOutputDir.set(generatedRoot)
        pathToParser.set("com/mayreh/intellij/plugin/${spec.component}/parser/${spec.class}.java")
        pathToPsiRoot.set("com/mayreh/intellij/plugin/${spec.component}/psi")
    }
}

sourceSets {
    main {
        java.srcDir(files(generatedRoot)
                .builtBy(lexerTasks, parserTasks))
    }
}

tasks.withType(Test).configureEach {
    testLogging {
        events = [TestLogEvent.FAILED,
                  TestLogEvent.PASSED,
                  TestLogEvent.SKIPPED,
                  TestLogEvent.STANDARD_OUT]
        exceptionFormat = TestExceptionFormat.FULL
        showExceptions = true
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}
